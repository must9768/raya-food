<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | مأكولات الراية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b09;--card:#1d1813;--line:#2e261d;--text:#f5efe8;--muted:#a89c8e;--orange:#ff7a1a;--orange2:#ffa04d;--ok:#25d366;--err:#ff5a5a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:80px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--orange)!important}
.login{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;padding:20px}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;width:100%;max-width:340px;display:grid;gap:10px;text-align:center}
.login-box h1{color:var(--orange2);font-size:1.3rem}
.login-box input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);text-align:center}
.login-box button{padding:12px;border-radius:10px;font-weight:800;background:linear-gradient(135deg,var(--orange2),var(--orange));color:#1a0d00}
.msg{font-size:.82rem;min-height:1.2em}.msg.err{color:var(--err)}
.app{max-width:1100px;margin:0 auto;padding:14px}
.app header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap;gap:8px}
.app header h1{color:var(--orange2);font-size:1.1rem}
.app header .btns{display:flex;gap:6px}
.app header button{padding:8px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.8rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:9px 15px;border-radius:999px;font-weight:700;font-size:.82rem;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tabs button.active{background:linear-gradient(135deg,var(--orange2),var(--orange));color:#1a0d00;border-color:transparent}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;color:var(--orange2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:.78rem;font-weight:700;color:var(--muted)}
.in,.field input{width:100%;padding:9px 11px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.btn{padding:9px 16px;border-radius:9px;font-weight:800;font-size:.82rem;background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,var(--orange2),var(--orange));color:#1a0d00;border:0}
.btn.danger{background:#3a1512;border-color:#7a2b25;color:#ffb3a8}
.btn.small{padding:6px 10px;font-size:.75rem}
.item-row,.sub{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.item-row .top{display:flex;gap:10px;align-items:flex-start}
.item-row .thumb{width:80px;height:80px;border-radius:8px;background:var(--card);flex-shrink:0;cursor:pointer;border:1px dashed var(--line);display:grid;place-items:center;font-size:1.8rem;overflow:hidden}
.item-row .thumb img{width:100%;height:100%;object-fit:cover}
.item-row .fields{flex:1;display:grid;gap:6px}
.item-row .in{padding:7px 9px;background:var(--card);font-size:.85rem}
.item-row .actions{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.chead{display:grid;grid-template-columns:50px 1fr auto;gap:8px;align-items:center;margin-bottom:10px}
.zrow{display:grid;grid-template-columns:1fr 100px 32px;gap:8px;margin-bottom:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--card);border:1px solid var(--orange);padding:10px 20px;border-radius:999px;font-weight:700;font-size:.85rem;opacity:0;pointer-events:none;transition:all .3s;z-index:1000;text-align:center;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{border-color:var(--err)}
.save-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:900;background:var(--card);border:1px solid var(--line);padding:8px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.save-bar button{padding:9px 18px;border-radius:999px;font-weight:800;font-size:.85rem}
.save-bar .save{background:linear-gradient(135deg,var(--orange2),var(--orange));color:#1a0d00}
.save-bar .save:disabled{opacity:.4}
.save-bar .revert{background:var(--bg);border:1px solid var(--line);color:var(--muted)}

/* ===== منيو منظم: أقسام (أكورديون) + أصناف ===== */
.warn{background:#2a1d0a;border:1px solid #7a5a1f;border-radius:12px;padding:12px;margin-bottom:12px;font-size:.82rem;line-height:1.7}
.warn pre{direction:ltr;text-align:left;background:var(--bg);padding:8px;border-radius:8px;overflow-x:auto;font-size:.7rem;margin:8px 0;white-space:pre}
.hint{font-size:.72rem;color:var(--muted);margin-bottom:6px}
.lbl{display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:3px}
.cat-block{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.cat-block.open{border-color:rgba(255,122,26,.55)}
.cat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.cat-ico{font-size:1.5rem;width:42px;height:42px;display:grid;place-items:center;background:var(--bg);border-radius:10px;flex-shrink:0}
.cat-meta{flex:1;min-width:0}
.cat-meta b{display:block;font-size:1rem}
.cat-meta small{color:var(--muted);font-size:.74rem}
.tools{display:flex;gap:4px;align-items:center;flex-shrink:0}
.ibtn{width:30px;height:30px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:.75rem;display:grid;place-items:center;color:var(--muted)}
.ibtn:active{transform:scale(.9)}
.chev{display:inline-block;width:22px;text-align:center;color:var(--muted);transition:transform .2s}
.cat-block.open>.cat-head .chev,.it.open>.it-head .chev{transform:rotate(180deg)}
.cat-body{display:none;padding:12px;border-top:1px solid var(--line)}
.cat-block.open>.cat-body{display:block}
.it{background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.it.open{border-color:var(--orange)}
.it-head{display:flex;align-items:center;gap:10px;padding:8px;cursor:pointer}
.mini{width:48px;height:48px;border-radius:8px;overflow:hidden;background:var(--card);display:grid;place-items:center;flex-shrink:0;font-size:1.3rem}
.mini img{width:100%;height:100%;object-fit:cover}
.it-meta{flex:1;min-width:0}
.it-meta b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-meta small{color:var(--muted);font-size:.74rem}
.it-meta s{opacity:.7}
.tag{background:#3a1a22;color:#ff8aa0;border-radius:6px;padding:0 6px;font-size:.7rem;font-weight:800;margin-inline-start:4px}
.it-body{display:none;padding:12px;border-top:1px solid var(--line);gap:14px}
.it.open>.it-body{display:grid}
.sec-t{font-size:.82rem;font-weight:800;color:var(--orange2);margin-bottom:4px}
.final{font-size:.8rem;color:var(--ok);font-weight:700}
.chk{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.chk input{width:auto}
.gal{display:flex;flex-wrap:wrap;gap:8px}
.gimg{position:relative;width:80px;height:80px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.gimg.main{border-color:var(--orange);border-width:2px}
.gimg img{width:100%;height:100%;object-fit:cover}
.gb{position:absolute;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:.75rem;display:grid;place-items:center}
.gb.x{top:3px;left:3px}
.gb.m{bottom:3px;left:3px;color:#ffc46b}
.gimg .bm{position:absolute;bottom:0;right:0;left:0;text-align:center;background:var(--orange);color:#1a0d00;font-size:.62rem;font-weight:800}
.gadd{width:80px;height:80px;border-radius:10px;border:1px dashed var(--orange);display:grid;place-items:center;color:var(--orange2);font-size:.72rem;font-weight:700;text-align:center;line-height:1.3;background:rgba(255,122,26,.06)}
.orow{display:grid;grid-template-columns:1fr 96px 32px;gap:6px;margin-bottom:6px}
.ibtn:disabled{opacity:.25}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-box">
    <h1>🔐 لوحة التحكم</h1>
    <p style="color:var(--muted);font-size:.8rem">مأكولات الراية</p>
    <input type="email" id="email" placeholder="البريد الإلكتروني" autocomplete="username">
    <input type="password" id="pwd" placeholder="كلمة السر" autocomplete="current-password">
    <button id="loginBtn">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div class="app" id="app" hidden>
  <header>
    <h1>⚙️ لوحة التحكم</h1>
    <div class="btns"><button id="previewBtn">👁️ الموقع</button><button id="logoutBtn">🚪 خروج</button></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="settings" class="active">⚙️ الإعدادات</button>
    <button data-tab="menu">📋 المنيو والصور</button>
    <button data-tab="delivery">🛵 التوصيل</button>
    <button data-tab="coupons">🎟️ الكوبونات</button>
    <button data-tab="orders">📦 الطلبات</button>
  </nav>
  <main>
    <section id="tab-settings" class="panel active"></section>
    <section id="tab-menu" class="panel"></section>
    <section id="tab-delivery" class="panel"></section>
    <section id="tab-coupons" class="panel"></section>
    <section id="tab-orders" class="panel"></section>
  </main>
  <div class="save-bar">
    <button class="save" id="saveBtn" disabled>💾 حفظ ونشر</button>
    <button class="revert" id="revertBtn">↩️ تراجع</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
var SUPABASE_URL = "https://phzpqynfnkizlwbeufvt.supabase.co";
var SUPABASE_KEY = "sb_publishable_dxqYBSoSLz6NUHBBzldSXw_VBh1zXod";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var settings = {}, categories = [], zones = [], coupons = [], dirty = false, pendingUpload = null;

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function nz(v, d){ return (v === undefined || v === null || v === "" || isNaN(Number(v))) ? d : Number(v); }
var toastTimer;
function toast(msg, isErr){
  var t = $("#toast"); t.textContent = msg; t.classList.toggle("err", !!isErr); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function setDirty(v){ dirty = v; $("#saveBtn").disabled = !v; }
window.addEventListener("beforeunload", function(e){ if (dirty){ e.preventDefault(); e.returnValue = ""; } });

/* ===== Login ===== */
function loginMsg(t, err){ var m = $("#loginMsg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); }
$("#loginBtn").addEventListener("click", async function(){
  var email = $("#email").value.trim(), pwd = $("#pwd").value;
  if (!email || !pwd){ loginMsg("أدخل البريد وكلمة السر", true); return; }
  loginMsg("⏳ جاري التحقق...");
  try {
    var r = await sb.auth.signInWithPassword({ email: email, password: pwd });
    if (r.error) loginMsg(r.error.message, true); else { loginMsg(""); showApp(); }
  } catch(e){ loginMsg("خطأ: " + e.message, true); }
});
["email","pwd"].forEach(function(id){
  document.getElementById(id).addEventListener("keydown", function(e){ if (e.key === "Enter") $("#loginBtn").click(); });
});
async function checkAuth(){
  try { var r = await sb.auth.getSession(); if (r.data.session) showApp(); } catch(e){}
}
$("#logoutBtn").addEventListener("click", async function(){ await sb.auth.signOut(); location.reload(); });
$("#previewBtn").addEventListener("click", function(){ window.open("index.html", "_blank"); });

async function showApp(){
  $("#login").style.display = "none"; $("#app").hidden = false;
  toast("⏳ جاري التحميل...");
  if (!(await loadAll())){ toast("فشل تحميل البيانات", true); return; }
  renderAll(); setDirty(false); toast("✓ تم التحميل");
}
function renderAll(){ renderSettings(); renderMenu(); renderDelivery(); renderCoupons(); renderOrders(); }

async function loadAll(){
  try {
    var r1 = await sb.from("settings").select("*").eq("id", 1).single();
    var r2 = await sb.from("categories").select("*").order("sort_order");
    var r3 = await sb.from("items").select("*").order("sort_order");
    var r4 = await sb.from("delivery_zones").select("*").order("sort_order");
    var r5 = await sb.from("coupons").select("*");
    if (r1.error || r2.error || r3.error || r4.error || r5.error) return false;
    settings = r1.data || {};
    var items = r3.data || [];
    categories = (r2.data || []).map(function(c){
      return { id: c.id, name: c.name, icon: c.icon, items: items.filter(function(i){ return i.category_id === c.id; }).map(normItem) };
    });
    var pr = await sb.from("items").select("images,discount,discount_type,options").limit(1);
    schemaOk = !pr.error;
    zones = r4.data || []; coupons = r5.data || [];
    return true;
  } catch(e){ console.error(e); return false; }
}

$("#tabs").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-tab]"); if (!btn) return;
  document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.toggle("active", b === btn); });
  document.querySelectorAll(".panel").forEach(function(p){ p.classList.toggle("active", p.id === "tab-" + btn.dataset.tab); });
});

/* ===== Settings ===== */
var SET_FIELDS = [
  ["brand","اسم المطعم",""],["slogan","الشعار (سلوغان)",""],
  ["whatsapp","📱 واتساب (9647701234567)",""],["phone","📞 الهاتف",""],
  ["address","📍 العنوان","",1],["instagram","إنستغرام","https://..."],["facebook","فيسبوك","https://..."],
  ["hours_open","يفتح (0-23)",12,0,"number"],["hours_close","يغلق (0-23)",2,0,"number"],
  ["map_lat","Latitude",33.3152],["map_lng","Longitude",44.3661]
];
function renderSettings(){
  var html = '<div class="card"><h2>🏪 معلومات المطعم</h2><div class="grid2">';
  SET_FIELDS.forEach(function(f){
    var v = settings[f[0]]; if (v === undefined || v === null) v = (typeof f[2] === "number") ? f[2] : "";
    html += '<div class="field"' + (f[3] ? ' style="grid-column:1/-1"' : '') + '><label>' + f[1] + '</label><input data-k="' + f[0] + '" type="' + (f[4] || "text") + '" value="' + esc(v) + '"' + (typeof f[2] === "string" && f[2] ? ' placeholder="' + f[2] + '"' : '') + '></div>';
  });
  html += '</div></div>';
  html += '<div class="card"><h2>🕒 وقت الطلبات — القسم الشرقي</h2><p class="hint">اختَر بنفسك وقت السماح للزبائن بطلب أصناف القسم الشرقي. التوقيت حسب العراق.</p>' +
    '<label class="chk" style="margin:10px 0"><input id="easternEnabled" type="checkbox"' + (settings.eastern_enabled ? ' checked' : '') + '> تفعيل وقت محدد للقسم الشرقي</label>' +
    '<div class="grid2"><div class="field"><label>وقت بدء الطلبات</label><input id="easternStart" type="time" value="' + esc(settings.eastern_start || '18:00') + '"></div>' +
    '<div class="field"><label>وقت إيقاف الطلبات</label><input id="easternEnd" type="time" value="' + esc(settings.eastern_end || '23:00') + '"></div></div></div>';
  html += '<div class="card"><h2>🕒 وقت الطلبات — القسم الغربي</h2><p class="hint">اختَر وقتاً مستقلاً للقسم الغربي. إذا لم تفعّل الجدولة، يبقى القسم ظاهراً طوال اليوم.</p>' +
    '<label class="chk" style="margin:10px 0"><input id="westernEnabled" type="checkbox"' + (settings.western_enabled ? ' checked' : '') + '> تفعيل وقت محدد للقسم الغربي</label>' +
    '<div class="grid2"><div class="field"><label>وقت بدء الطلبات</label><input id="westernStart" type="time" value="' + esc(settings.western_start || '18:00') + '"></div>' +
    '<div class="field"><label>وقت إيقاف الطلبات</label><input id="westernEnd" type="time" value="' + esc(settings.western_end || '23:00') + '"></div></div></div>';
  html += '<div class="card"><h2>🖼️ تغيير شعار المطعم</h2>' +
    '<p class="hint">اختر صورة من موبايلك، انتظر اكتمال الرفع، ثم اضغط «حفظ ونشر» بالأسفل.</p>' +
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><img id="logoPreview" src="' + esc(settings.logo_url || '') + '" alt="معاينة الشعار" style="width:100px;height:100px;object-fit:contain;border-radius:12px;background:#0d0b09;border:1px solid #2e261d;' + (settings.logo_url ? '' : 'display:none;') + '">' +
    '<div><input id="logoFile" type="file" accept="image/*" style="max-width:100%;margin-bottom:8px"><div class="hint">يفضّل صورة PNG أو WebP واضحة.</div><div id="logoStatus" class="hint"></div></div></div></div>';
  $("#tab-settings").innerHTML = html;
  document.querySelectorAll("#tab-settings [data-k]").forEach(function(el){
    el.addEventListener("input", function(){
      settings[el.getAttribute("data-k")] = el.type === "number" ? (el.value === "" ? null : Number(el.value)) : el.value;
      setDirty(true);
    });
  });
  ["easternEnabled","easternStart","easternEnd","westernEnabled","westernStart","westernEnd"].forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener("change", function(){
      if (id === "easternEnabled") settings.eastern_enabled = el.checked;
      if (id === "easternStart") settings.eastern_start = el.value;
      if (id === "easternEnd") settings.eastern_end = el.value;
      if (id === "westernEnabled") settings.western_enabled = el.checked;
      if (id === "westernStart") settings.western_start = el.value;
      if (id === "westernEnd") settings.western_end = el.value;
      setDirty(true);
    });
  });
  document.getElementById("logoFile").addEventListener("change", async function(){
    var file = this.files && this.files[0]; if (!file) return;
    if (!file.type.startsWith("image/")){ toast("اختَر ملف صورة", true); return; }
    if (file.size > 5 * 1024 * 1024){ toast("حجم الصورة لازم أقل من 5 ميغابايت", true); return; }
    var status = document.getElementById("logoStatus"); status.textContent = "⏳ جاري رفع الشعار...";
    try {
      var ext = (file.name.split(".").pop() || "png").toLowerCase();
      if (["jpg","jpeg","png","webp","gif"].indexOf(ext) < 0) ext = "png";
      var path = "restaurant-logo-" + Date.now() + "." + ext;
      var up = await sb.storage.from("food-images").upload(path, file, {cacheControl:"3600", upsert:false});
      if (up.error) throw up.error;
      settings.logo_url = sb.storage.from("food-images").getPublicUrl(path).data.publicUrl;
      var preview = document.getElementById("logoPreview"); preview.src = settings.logo_url; preview.style.display = "block";
      status.textContent = "✅ تم رفع الصورة. اضغط حفظ ونشر حتى يتحدث الموقع."; setDirty(true);
    } catch(err) { console.error(err); status.textContent = "فشل الرفع: " + (err.message || "تأكد من إعدادات التخزين"); toast("فشل رفع الشعار", true); }
  });
}

var schemaOk = true;
var SQL_TEXT = "alter table items add column if not exists images jsonb default '[]'::jsonb;\n" +
  "alter table items add column if not exists discount numeric default 0;\n" +
  "alter table items add column if not exists discount_type text default 'percent';\n" +
  "alter table items add column if not exists options jsonb default '{}'::jsonb;\n" +
  "notify pgrst, 'reload schema';";

function fmtN(n){ return Number(n || 0).toLocaleString("en-US"); }
function normItem(i){
  var imgs = Array.isArray(i.images) ? i.images.filter(Boolean) : [];
  if (!imgs.length && i.image_url) imgs = [i.image_url];
  var o = (i.options && typeof i.options === "object") ? i.options : {};
  var mk = function(a){ return (Array.isArray(a) ? a : []).map(function(x){ return { n: String((x && x.n) || ""), d: Number(x && x.d) || 0 }; }); };
  return { id: i.id, category_id: i.category_id, name: i.name, price: i.price, image_url: i.image_url || "", is_best_seller: !!i.is_best_seller,
    discount: Number(i.discount) || 0, discount_type: i.discount_type === "fixed" ? "fixed" : "percent", images: imgs, options: { sizes: mk(o.sizes), extras: mk(o.extras) } };
}
function newItem(name, price){ return normItem({ name: name, price: price }); }
function itemFinal(it){
  var p = Number(it.price) || 0, d = Number(it.discount) || 0;
  if (d <= 0) return p;
  return Math.max(0, it.discount_type === "fixed" ? p - d : Math.round(p * (1 - Math.min(d, 100) / 100)));
}
function finalText(it){
  var f = itemFinal(it), p = Number(it.price) || 0;
  return f < p ? "السعر بعد الخصم: " + fmtN(f) + " د.ع (توفير " + fmtN(p - f) + ")" : "بدون خصم";
}
function itemSummary(it){
  var f = itemFinal(it), p = Number(it.price) || 0, h = "";
  if (f < p) h += "<s>" + fmtN(p) + "</s> ";
  h += fmtN(f) + " د.ع";
  if (f < p) h += '<span class="tag">خصم ' + (it.discount_type === "fixed" ? fmtN(it.discount) + " د.ع" : Math.round(it.discount) + "%") + "</span>";
  h += " • " + it.images.length + " 📷";
  var oc = it.options.sizes.length + it.options.extras.length;
  if (oc) h += " • ⚙️ " + oc;
  return h;
}
function cleanOpts(a){
  return (a || []).map(function(x){ return { n: String(x.n || "").replace(/[|:]/g, " ").replace(/\s+/g, " ").trim(), d: Number(x.d) || 0 }; })
    .filter(function(x){ return x.n; });
}

function onMenuInput(e){
  var el = e.target, cb = el.closest("[data-ci]"); if (!cb) return;
  var cat = categories[Number(cb.getAttribute("data-ci"))], cf = el.getAttribute("data-cf");
  if (cf){
    cat[cf] = el.value;
    if (cf === "name") cb.querySelector(".cat-meta b").textContent = el.value || "بدون اسم";
    else cb.querySelector(".cat-ico").textContent = el.value || "🍽️";
    setDirty(true); return;
  }
  var itEl = el.closest("[data-ii]"); if (!itEl) return;
  var it = cat.items[Number(itEl.getAttribute("data-ii"))], f = el.getAttribute("data-f"), of = el.getAttribute("data-of");
  if (f === "name") it.name = el.value;
  else if (f === "price") it.price = Number(el.value) || 0;
  else if (f === "discount") it.discount = Math.max(0, Number(el.value) || 0);
  else if (of){
    var row = el.closest(".orow"), o = it.options[row.getAttribute("data-g")][Number(row.getAttribute("data-k"))];
    if (of === "n") o.n = el.value; else o.d = Number(el.value) || 0;
  } else return;
  itEl.querySelector(".it-meta b").textContent = it.name || "صنف بدون اسم";
  itEl.querySelector("[data-sum]").innerHTML = itemSummary(it);
  itEl.querySelector("[data-final]").textContent = finalText(it);
  setDirty(true);
}

function onMenuChange(e){
  var el = e.target, f = el.getAttribute("data-f"); if (!f) return;
  var cb = el.closest("[data-ci]"), itEl = el.closest("[data-ii]"); if (!cb || !itEl) return;
  var ci = Number(cb.getAttribute("data-ci")), cat = categories[ci], ii = Number(itEl.getAttribute("data-ii")), it = cat.items[ii];
  if (f === "best"){ it.is_best_seller = el.checked; setDirty(true); }
  else if (f === "dtype"){
    it.discount_type = el.value === "fixed" ? "fixed" : "percent";
    itEl.querySelector("[data-sum]").innerHTML = itemSummary(it);
    itEl.querySelector("[data-final]").textContent = finalText(it);
    setDirty(true);
  } else if (f === "move"){
    var to = Number(el.value); if (to === ci) return;
    cat.items.splice(ii, 1); it._open = true;
    categories.forEach(function(c){ c._open = false; });
    categories[to]._open = true; categories[to].items.push(it);
    setDirty(true); renderMenu(); toast("تم نقل الصنف إلى «" + (categories[to].name || "") + "»");
  }
}

function swap(arr, i, j){ if (j < 0 || j >= arr.length) return false; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; return true; }

function onMenuClick(e){
  var btn = e.target.closest("[data-act]"); if (!btn) return;
  var act = btn.getAttribute("data-act");
  var cb = btn.closest("[data-ci]"), ci = cb ? Number(cb.getAttribute("data-ci")) : -1, cat = categories[ci];
  var itEl = btn.closest("[data-ii]"), ii = (itEl && cat) ? Number(itEl.getAttribute("data-ii")) : -1, it = (cat && ii >= 0) ? cat.items[ii] : null;

  if (act === "toggle-cat"){
    var wo = !cat._open; categories.forEach(function(c){ c._open = false; }); cat._open = wo;
    document.querySelectorAll("#catsBox > .cat-block").forEach(function(b, k){ b.classList.toggle("open", !!categories[k]._open); });
    if (wo) setTimeout(function(){ cb.scrollIntoView({ block: "start", behavior: "smooth" }); }, 40);
    return;
  }
  if (act === "toggle-item"){
    var wi = !it._open; cat.items.forEach(function(x){ x._open = false; }); it._open = wi;
    cb.querySelectorAll(".it").forEach(function(b, k){ b.classList.toggle("open", !!cat.items[k]._open); });
    return;
  }
  if (act === "copy-sql"){
    (navigator.clipboard ? navigator.clipboard.writeText(SQL_TEXT) : Promise.reject()).then(function(){ toast("تم النسخ ✓"); }, function(){ toast("انسخ الكود يدوياً", true); });
    return;
  }
  if (act === "recheck"){
    sb.from("items").select("images,discount,discount_type,options").limit(1).then(function(r){
      schemaOk = !r.error; renderMenu(); toast(schemaOk ? "✅ تمام، الأعمدة موجودة" : "الأعمدة ما زالت ناقصة", !schemaOk);
    });
    return;
  }
  if (act === "img-add"){ pendingUpload = it; var fi = $("#fileIn"); fi.value = ""; fi.click(); return; }

  if (act === "cat-up") { if (!swap(categories, ci, ci - 1)) return; }
  else if (act === "cat-down") { if (!swap(categories, ci, ci + 1)) return; }
  else if (act === "del-cat"){ if (!confirm("حذف القسم كامل مع أصنافه؟")) return; categories.splice(ci, 1); }
  else if (act === "add-cat"){
    categories.forEach(function(c){ c._open = false; });
    categories.push({ id: null, name: "قسم جديد", icon: "🍽️", items: [], _open: true });
  }
  else if (act === "add-item"){
    cat.items.forEach(function(x){ x._open = false; });
    var ni = newItem("صنف جديد", 1000); ni._open = true; cat.items.push(ni);
  }
  else if (act === "it-up") { if (!swap(cat.items, ii, ii - 1)) return; }
  else if (act === "it-down") { if (!swap(cat.items, ii, ii + 1)) return; }
  else if (act === "del-item"){ if (!confirm("حذف الصنف؟")) return; cat.items.splice(ii, 1); }
  else if (act === "img-main"){ var k1 = Number(btn.closest("[data-k]").getAttribute("data-k")); it.images.unshift(it.images.splice(k1, 1)[0]); }
  else if (act === "img-del"){ it.images.splice(Number(btn.closest("[data-k]").getAttribute("data-k")), 1); }
  else if (act === "add-opt"){ it.options[btn.getAttribute("data-g")].push({ n: "", d: 0 }); }
  else if (act === "del-opt"){ var row = btn.closest(".orow"); it.options[row.getAttribute("data-g")].splice(Number(row.getAttribute("data-k")), 1); }
  else if (act === "import"){
    var added = 0;
    OLD_MENU.forEach(function(oc){
      var cc = categories.filter(function(c){ return c.name === oc.n; })[0];
      if (!cc){ cc = { id: null, name: oc.n, icon: oc.i, items: [] }; categories.push(cc); }
      oc.t.forEach(function(x){
        if (!cc.items.some(function(i){ return i.name === x[0]; })){ cc.items.push(newItem(x[0], x[1])); added++; }
      });
    });
    if (!added){ toast("المنيو القديم موجود بالكامل"); return; }
    setDirty(true); renderMenu(); toast("تم استيراد " + added + " صنف، اضغط حفظ ونشر"); return;
  }
  else return;
  setDirty(true); renderMenu();
}

(function wireMenu(){

})();

document.addEventListener("change", async function(e){
  if (e.target.id !== "fileIn") return;
  var files = Array.prototype.slice.call(e.target.files || []), it = pendingUpload;
  if (!files.length || !it) return;
  var ok = 0;
  for (var n = 0; n < files.length; n++){
    var file = files[n];
    if (!file.type.startsWith("image/")){ toast("«" + file.name + "» ليست صورة", true); continue; }
    if (file.size > 5 * 1024 * 1024){ toast("«" + file.name + "» كبيرة (الحد 5 ميجا)", true); continue; }
    var ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    if (["jpg","jpeg","png","webp","gif"].indexOf(ext) < 0) ext = "jpg";
    var path = "item-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
    toast("⏳ جاري رفع " + (n + 1) + " من " + files.length + "...");
    try {
      var r = await sb.storage.from("food-images").upload(path, file, { cacheControl: "3600", upsert: false });
      if (r.error) throw r.error;
      it.images.push(sb.storage.from("food-images").getPublicUrl(path).data.publicUrl); ok++;
    } catch(err){ console.error(err); toast("فشل الرفع: " + (err.message || "خطأ"), true); }
  }
  if (ok){ it._open = true; setDirty(true); renderMenu(); toast("✅ تم رفع " + ok + " صورة، اضغط حفظ ونشر"); }
});

    var opt = function(v, t){ return '<option value="' + v + '"' + (c.type === v ? " selected" : "") + '>' + t + '</option>'; };
    div.innerHTML = '<div style="display:grid;grid-template-columns:1fr 32px;gap:8px;margin-bottom:6px">' +
      '<input class="in" data-f="code" value="' + esc(c.code) + '" style="font-family:monospace;font-weight:800;text-transform:uppercase;color:var(--orange2)"><button class="btn small danger" data-act="del">×</button></div>' +
      '<div class="grid2"><select class="in" data-f="type">' + opt("percent","نسبة %") + opt("fixed","مبلغ ثابت") + opt("freedel","توصيل مجاني") + '</select>' +
      '<input class="in" type="number" data-f="value" value="' + esc(c.value) + '" placeholder="القيمة"></div>' +
      '<input class="in" type="number" data-f="min" value="' + esc(c.min_order || 0) + '" placeholder="الحد الأدنى" style="margin-top:6px">' +
      '<label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.8rem;color:var(--muted)"><input type="checkbox" data-f="active"' + (c.is_active !== false ? " checked" : "") + ' style="width:auto"> فعّال</label>';
    box.appendChild(div);
  });
  box.addEventListener("input", function(e){
    var f = e.target.getAttribute("data-f"); if (!f || f === "active" || f === "type") return;
    var c = coupons[Number(e.target.closest("[data-i]").getAttribute("data-i"))];
    if (f === "code") c.code = e.target.value.toUpperCase(); else if (f === "value") c.value = Number(e.target.value) || 0; else c.min_order = Number(e.target.value) || 0;
    setDirty(true);
  });
  box.addEventListener("change", function(e){
    var f = e.target.getAttribute("data-f"); if (f !== "type" && f !== "active") return;
    var c = coupons[Number(e.target.closest("[data-i]").getAttribute("data-i"))];
    if (f === "type") c.type = e.target.value; else c.is_active = e.target.checked;
    setDirty(true);
  });
  box.addEventListener("click", function(e){
    var b = e.target.closest("[data-act=del]"); if (!b || !confirm("حذف الكود؟")) return;
    coupons.splice(Number(b.closest("[data-i]").getAttribute("data-i")), 1); setDirty(true); renderCoupons();
  });
  $("#addCpBtn").addEventListener("click", function(){
    coupons.push({ code: "NEW" + Date.now().toString().slice(-4), type: "percent", value: 10, min_order: 0, is_active: true }); setDirty(true); renderCoupons();
  });
}

/* ===== Orders ===== */
function renderOrders(){
  $("#tab-orders").innerHTML = '<div class="card"><h2>📦 الطلبات <button class="btn small" id="refreshOrders">🔄 تحديث</button></h2><div id="ordersBox">⏳ جاري التحميل...</div></div>';
  loadOrders(); $("#refreshOrders").addEventListener("click", loadOrders);
}
async function loadOrders(){
  var r = await sb.from("orders").select("*").order("created_at", { ascending: false }).limit(50), box = $("#ordersBox");
  if (r.error){ box.innerHTML = '<div style="color:var(--err);padding:10px">خطأ: ' + esc(r.error.message) + '</div>'; return; }
  if (!r.data || !r.data.length){ box.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px">ما كو طلبات بعد</div>'; return; }
  var col = { pending: "#ffa04d", preparing: "#3b82f6", delivered: "#25d366", cancelled: "#ff5a5a" };
  var lab = { pending: "قيد الانتظار", preparing: "قيد التحضير", delivered: "تم التسليم", cancelled: "ملغي" };
  box.innerHTML = r.data.map(function(o){
    return '<div class="sub"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="color:var(--orange2)">#' + esc(o.order_number) + '</b>' +
      '<span style="background:' + (col[o.status] || "#666") + ';color:#000;padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:800">' + esc(lab[o.status] || o.status) + '</span></div>' +
      '<div style="font-size:.82rem">👤 ' + esc(o.customer_name) + ' • 📞 ' + esc(o.customer_phone) + '</div>' +
      (o.customer_address ? '<div style="font-size:.78rem;color:var(--muted)">📍 ' + esc(o.customer_address) + '</div>' : '') +
      '<div style="font-size:.78rem;color:var(--muted);margin-top:4px">' + (o.order_type === "delivery" ? "🛵 توصيل" : "🏪 استلام") + ' • ' + esc(new Date(o.created_at).toLocaleString("ar")) + '</div>' +
      '<div style="color:var(--orange2);font-weight:900;margin-top:6px">المجموع: ' + Number(o.total).toLocaleString("en-US") + ' د.ع</div></div>';
  }).join("");
}

/* ===== Save (آمن: تحديث/إضافة حسب id، والحذف أخيراً) ===== */
async function dbIds(t){ var r = await sb.from(t).select("id"); if (r.error) throw r.error; return r.data.map(function(x){ return x.id; }); }
async function upsert(t, id, row){
  var r;
  if (id){ r = await sb.from(t).update(row).eq("id", id); if (r.error) throw r.error; return id; }
  r = await sb.from(t).insert(row).select("id").single(); if (r.error) throw r.error; return r.data.id;
}
async function removeMissing(t, oldIds, keep){
  var del = oldIds.filter(function(id){ return keep.indexOf(id) < 0; });
  if (!del.length) return;
  var r = await sb.from(t).delete().in("id", del); if (r.error) throw r.error;
}
$("#saveBtn").addEventListener("click", async function(){
  if (!dirty) return;
  toast("⏳ جاري الحفظ..."); $("#saveBtn").disabled = true;
  try {
    var s = settings;
    var r = await sb.from("settings").update({
      brand: s.brand || "", slogan: s.slogan || "", whatsapp: s.whatsapp || "", phone: s.phone || "",
      address: s.address || "", instagram: s.instagram || "", facebook: s.facebook || "",
      hours_open: nz(s.hours_open, 12), hours_close: nz(s.hours_close, 2),
      map_lat: nz(s.map_lat, 33.3152), map_lng: nz(s.map_lng, 44.3661),
      eastern_enabled: !!s.eastern_enabled, eastern_start: s.eastern_start || "18:00", eastern_end: s.eastern_end || "23:00",
      western_enabled: !!s.western_enabled, western_start: s.western_start || "18:00", western_end: s.western_end || "23:00",
      logo_url: s.logo_url || "", updated_at: new Date().toISOString()
    }).eq("id", 1);
    if (r.error) throw r.error;

    var oldItems = await dbIds("items"), oldCats = await dbIds("categories"), oldZones = await dbIds("delivery_zones"), oldCps = await dbIds("coupons");
    var keepItems = [];
    for (var i = 0; i < categories.length; i++){
      var c = categories[i];
      c.id = await upsert("categories", c.id, { name: c.name || "", icon: c.icon || "🍽️", sort_order: i });
      for (var j = 0; j < c.items.length; j++){
        var it = c.items[j];
        it.category_id = c.id;
        var row = { category_id: c.id, name: it.name || "", price: nz(it.price, 0), image_url: (it.images && it.images[0]) || "", is_best_seller: !!it.is_best_seller, sort_order: j };
        if (schemaOk){
          row.images = it.images || [];
          row.discount = Math.min(nz(it.discount, 0), it.discount_type === "fixed" ? 100000000 : 100);
          row.discount_type = it.discount_type === "fixed" ? "fixed" : "percent";
          row.options = { sizes: cleanOpts(it.options && it.options.sizes), extras: cleanOpts(it.options && it.options.extras) };
        }
        it.id = await upsert("items", it.id, row);
        keepItems.push(it.id);
      }
    }
    for (var a = 0; a < zones.length; a++) zones[a].id = await upsert("delivery_zones", zones[a].id, { name: zones[a].name || "", fee: nz(zones[a].fee, 0), sort_order: a });
    for (var b = 0; b < coupons.length; b++){
      var cp = coupons[b];
      cp.id = await upsert("coupons", cp.id, { code: cp.code, type: cp.type, value: nz(cp.value, 0), min_order: nz(cp.min_order, 0), is_active: cp.is_active !== false });
    }
    await removeMissing("items", oldItems, keepItems);
    await removeMissing("categories", oldCats, categories.map(function(x){ return x.id; }));
    await removeMissing("delivery_zones", oldZones, zones.map(function(x){ return x.id; }));
    await removeMissing("coupons", oldCps, coupons.map(function(x){ return x.id; }));

    var openState = categories.map(function(x){ return { id: x.id, o: x._open, its: x.items.filter(function(i){ return i._open; }).map(function(i){ return i.id; }) }; });
    toast("✅ تم الحفظ والنشر"); setDirty(false); await loadAll();
    categories.forEach(function(x){
      var st = openState.filter(function(q){ return q.id === x.id; })[0]; if (!st) return;
      x._open = !!st.o; x.items.forEach(function(i){ i._open = st.its.indexOf(i.id) >= 0; });
    });
    renderMenu();
  } catch(err){
    console.error(err);
    var em = String(err.message || "غير معروف");
    toast(/column|schema/i.test(em) ? "نفّذ كود SQL للأعمدة الجديدة أولاً (يظهر بتبويب المنيو)" : "خطأ: " + em + " (ما انمسح شي)", true);
    $("#saveBtn").disabled = false;
  }
});
$("#revertBtn").addEventListener("click", async function(){
  if (!dirty){ toast("لا يوجد تعديلات"); return; }
  if (!confirm("تجاهل التعديلات؟")) return;
  await loadAll(); renderAll(); setDirty(false);
});

checkAuth();
</script>
